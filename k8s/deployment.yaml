# ==============================================================================
# Eureka registry.
#
# Single replica, and it must stay that way. application.yml runs standalone
# (register-with-eureka and fetch-registry both false), so a second replica
# would be an independent, empty registry rather than a peer - clients would
# see a different view depending on which pod the Service happened to pick.
# Peer-aware clustering is a separate piece of work.
#
# Self-preservation is forced on here, against the project default of off.
# Pods come and go far more often than containers on a host, and without it
# the registry evicts instances during a rolling update faster than their
# replacements can register, briefly leaving callers with no route at all.
#
# No envFrom in this manifest. In the monorepo this pod pulled in the shared
# `platform-config` ConfigMap, which carries DB_HOST, the Config Server URL and
# the Zipkin endpoint - none of which the registry reads. It has no datasource
# and no configserver: import, so the three variables below are its whole
# configuration.
#
# Probes use the Spring Boot probe groups, available because
# management.endpoint.health.probes.enabled is true in application.yml:
#   startup   - covers JVM + Tomcat + registry init. Nothing else runs until it
#               passes, which is why the other two need no initialDelaySeconds.
#   readiness - gates the Service endpoint: traffic only once the app is ready.
#   liveness  - restarts only a dead JVM, never a slow dependency.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: javams
  labels:
    app.kubernetes.io/name: service-discovery
    app.kubernetes.io/component: discovery
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge first, retire second: the replacement registry is ready before
      # the old one goes away, so no client ever finds the registry missing.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: service-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-discovery
        app.kubernetes.io/component: discovery
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      # server.shutdown: graceful lets in-flight requests finish; give the JVM
      # room to honour it before SIGKILL.
      terminationGracePeriodSeconds: 45
      volumes:
        # readOnlyRootFilesystem below would otherwise break startup: embedded
        # Tomcat creates a work directory under java.io.tmpdir before it can
        # bind a port, and an unwritable /tmp fails the boot rather than
        # degrading it.
        - name: tmp
          emptyDir: {}
      containers:
        - name: service-discovery
          # Overwritten per deploy by the CI pipeline, which substitutes the
          # immutable sha tag it just published. Left at a readable default so
          # `kubectl apply -k k8s` works by hand too.
          image: javams/service-discovery:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8761"
            # The registry builds its own eureka.client.service-url.defaultZone
            # from this, so it must be the name other pods resolve - the
            # Service name - not a pod hostname.
            - name: EUREKA_HOSTNAME
              value: "service-discovery"
            - name: EUREKA_SELF_PRESERVATION
              value: "true"
          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
